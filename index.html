<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>1-20</title>
    <meta name="theme-color" content="#f3eee6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="1-20" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?v=10" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>
    </div>

    <main class="app">
      <div class="topbar">
        <label class="mode-label" for="mode">
          <select id="mode" class="mode">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="abc">ABC</option>
            <option value="circles" selected>Circles</option>
            <option value="colors">Colors</option>
          </select>
        </label>
      </div>

      <div class="board" id="board" role="group" aria-label="1 to 20"></div>

      <div class="bottombar">
        <button type="button" class="tool hidden" id="addCircle">Add</button>
        <button type="button" class="tool" id="colors">Colors</button>
        <button type="button" class="tool hidden" id="caseToggle" aria-pressed="true">ABC</button>
      </div>
    </main>

    <script src="game.js?v=2"></script>
  </body>
</html>
